name: Validate categorical input schema preservation
on:
  push:
    branches: [validate-categorical-input-schema-i1]
permissions:
  contents: read
  actions: read
concurrency:
  group: categorical-schema-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        lane: [root-train, root-automl, root-features, python-baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/SynapseML
          ref: 37948d7d03ef0fa7f1aa24c54c2dd4d8a29c8dc0
          path: source
          persist-credentials: false
      - name: Measure complete baseline lane in owned hosted Docker
        env:
          VALIDATION_LANE: ${{ matrix.lane }}
          GH_TOKEN: ${{ github.token }}
        run: python3 packet/host.py

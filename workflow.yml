name: Validate batch image writing
on:
  push:
    branches: [validate-image-writer-658-i3]
permissions:
  contents: read
  actions: read
concurrency:
  group: image-writer-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        lane: [root, python-baseline, python-candidate, website-baseline, website-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/SynapseML
          ref: d3f3af6bd3e4b7d191f51c9eb29f9aeffe788193
          path: source
          persist-credentials: false
      - name: Validate full lane in owned hosted Docker
        env:
          VALIDATION_LANE: ${{ matrix.lane }}
          GH_TOKEN: ${{ github.token }}
        run: python3 packet/host.py

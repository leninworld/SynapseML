name: Validate VW Generic input schema
on:
  push:
    branches: [validate-vw-generic-schema-issue-2817-i1]
permissions:
  contents: read
  actions: read
concurrency:
  group: vw-generic-schema-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        lane: [root, python-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/SynapseML
          ref: 6c2699defcfb24d5bff5ba55f2252ba2d8cbea24
          path: source
          persist-credentials: false
      - name: Validate full lane in owned hosted Docker
        env:
          VALIDATION_LANE: ${{ matrix.lane }}
          GH_TOKEN: ${{ github.token }}
        run: python3 packet/host.py

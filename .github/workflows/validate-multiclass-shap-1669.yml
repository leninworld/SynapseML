name: Validate remaining multiclass SHAP website
on:
  push:
    branches: [validate-multiclass-shap-1669-i2]
permissions:
  contents: read
  actions: read
concurrency:
  group: multiclass-shap-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/SynapseML
          ref: d3f3af6bd3e4b7d191f51c9eb29f9aeffe788193
          path: source
          persist-credentials: false
      - name: Validate complete website at identical native-tested source
        env:
          VALIDATION_LANE: website-documentation
          FORMATTED_NOTEBOOK_B64: ""
          FORMATTED_NOTEBOOK_SHA256: "500f764863d70c8782a216942fc187dd9630a2140aa8ee07b11c0c9be15f000e"
          FORMATTED_PATCH_SHA256: "c0e41f5cf050d3a134d9f7a3b45cf1f87f9bc2fc17ef165268ea94853061477b"
          GH_TOKEN: ${{ github.token }}
        run: python3 packet/host.py

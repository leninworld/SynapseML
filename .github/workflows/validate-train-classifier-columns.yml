name: Validate TrainClassifier columns
on:
  push:
    branches: [validate-train-classifier-columns-issue-555]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D, E, F, G]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Anchor the original job clock
        run: echo "VALIDATION_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/SynapseML
          ref: ef69a5daa1cfa2346389a54e87ff8d3366d28431
          path: source
          persist-credentials: false
      - name: Calibrate and complete this lane in Docker
        env:
          VALIDATION_LANE: ${{ matrix.lane }}
        run: python3 packet/host.py

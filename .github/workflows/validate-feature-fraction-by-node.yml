name: Validate feature fraction by node
on:
  push:
    branches: [validate-feature-fraction-by-node-issue-789]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Anchor the original job clock
        run: echo "VALIDATION_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/SynapseML
          ref: e65143c6df061f6e763cc8f7c7d5a99eaecd3e7e
          path: source
          persist-credentials: false
      - name: Calibrate and complete this lane in Docker
        env:
          VALIDATION_LANE: ${{ matrix.lane }}
        run: python3 packet/host.py

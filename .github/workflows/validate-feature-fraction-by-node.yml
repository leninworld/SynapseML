name: Validate feature fraction CI registration
on:
  push:
    branches: [validate-feature-fraction-by-node-issue-789]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        lane: [B]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Anchor the original job clock
        run: echo "VALIDATION_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leninworld/SynapseML
          ref: bbb4a0a4c773b44f0da1f21b5c445813de41caf4
          path: source
          persist-credentials: false
      - name: Calibrate and complete this lane in Docker
        env:
          VALIDATION_LANE: ${{ matrix.lane }}
        run: python3 packet/host.py

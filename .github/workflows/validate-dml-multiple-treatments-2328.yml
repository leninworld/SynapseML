name: Validate multiple-treatment DML
on:
  push:
    branches: [validate-dml-multiple-treatments-2328-i1]
permissions:
  contents: read
  actions: read
concurrency:
  group: dml-multiple-treatments-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [candidate-legacy, candidate-causal-dml, candidate-installed, docs-website]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/SynapseML
          ref: d17f57e314517e4b413cda3cdcd86e7ad15ddb04
          path: source
          persist-credentials: false
      - name: Full candidate lane in bounded native Docker
        env:
          VALIDATION_LANE: ${{ matrix.lane }}
          GH_TOKEN: ${{ github.token }}
        run: python3 packet/host.py

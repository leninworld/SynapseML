name: Measure native DML baseline
on:
  push:
    branches: [validate-dml-native-baseline-2328-g0]
  workflow_dispatch:
    inputs:
      lane:
        type: choice
        options: [both, native-scala, installed-python]
        default: both
permissions:
  contents: read
  actions: read
concurrency:
  group: dml-native-baseline-${{ github.ref }}-${{ github.event.inputs.lane || 'both' }}
  cancel-in-progress: false
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event.inputs.lane == 'native-scala' && '["native-scala"]' || github.event.inputs.lane == 'installed-python' && '["installed-python"]' || '["native-scala","installed-python"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/SynapseML
          ref: 45578f08e6bacf8475de0e92f1717e761d40f795
          path: source
          persist-credentials: false
      - name: Native unmodified baseline in bounded Docker
        env:
          VALIDATION_LANE: ${{ matrix.lane }}
          GH_TOKEN: ${{ github.token }}
        run: python3 packet/host.py
